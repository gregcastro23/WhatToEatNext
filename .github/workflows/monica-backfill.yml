# Classify newly-arrived agents, nightly.
#
# This is the ONLY workflow in the repository that WRITES to production. Every
# guard below exists because of that.
#
# ── Why it exists ───────────────────────────────────────────────────────────
#
# Agents arrive without a monica and a backfill assigns one from the agent's own
# name. `[MEASURED 2026-07-28]` ~50 arrive per day (7-day range 43-57), and six
# appeared within fifteen minutes of a backfill finishing. Left to a human, the
# queue is never empty for long — which is how the integrity gate came to be red
# on master continuously from 2026-07-26, and, because a failed step used to
# cancel the rest of the job, silently skipped the four gates behind it including
# the economy SQL and ledger/balance gates.
#
# So the queue is cleared on a schedule, and the integrity check now treats queue
# depth as a threshold rather than a defect (scripts/checkAgentMonicaDrift.ts).
#
# ── Why 06:45 UTC ───────────────────────────────────────────────────────────
#
# Thirty minutes ahead of the 07:15 integrity cron in monica-integrity.yml, so
# the board is clear when the check runs. Not so close that a slow run overlaps
# it: a normal run takes well under a minute.
#
# ── Why this is safe to run unattended ──────────────────────────────────────
#
#   * values are DERIVED from each agent's own name — deterministic, and the
#     drift check independently re-computes every one of them afterwards
#   * the script snapshots to monica_preconstruction_<timestamp> before writing
#   * it migrates in ONE transaction
#   * --max-new bounds first-time classification, so a classifier or schema change
#     re-deciding the whole population stops and waits for a human instead of
#     rewriting thousands of rows overnight
#   * schedule + manual dispatch ONLY. Never on push or pull_request: a workflow
#     that writes to production must not be triggerable by opening a PR.

# ── ✅ RE-ARMED 2026-08-02 — the ADR-009 migration is done ───────────────────
#
# The nightly schedule is commented out, NOT deleted. Manual dispatch still
# works, so a deliberate, watched run is still one click away.
#
# WHY: ADR-009 unifies five per-planet weight scales onto the inertial scale.
# The moment that lands, every weight-derived monica recomputes to a different
# value — and this script rewrites what it recomputes. The UPDATEs at
# scripts/backfillMonicaPerConstruction.ts:310, :326 and :342 are keyed only on
# `WHERE up.user_id = v.user_id`, with no `monica_method IS NULL` guard, and the
# script says so itself at :104-106: "it does not care what is currently
# stored".
#
# `--max-new` does NOT hold this back. It bounds the count of NEW ARRIVALS
# (`monica_method IS NULL`, :108-112). Already-classified rows are not new, so
# they are not counted, not bounded, and rewritten anyway. On the first night
# after the migration deploys, that is all 469 two-body and 71 full-chart rows,
# unreviewed, at 06:45.
#
# It gets worse in combination: `scripts/checkAgentMonicaDrift.ts` will already
# be red at 07:15, reporting those same rows as defects that "cannot happen
# through ordinary operation" (:368-372), and its remediation text at :434-447
# tells the operator to run THIS script. So the alarm points at the thing that
# would silently make the alarm stop.
#
# ── All three re-arm conditions met, 2026-08-02 ─────────────────────────────
#
#  1. DEPLOYED. Vercel production is READY at 4da5929f — ADR-009 decision 5b's
#     merge commit — confirmed via the deployment's own githubCommitSha, not
#     from local git.
#  2. BACKFILL RAN. backfillMonicaPerConstruction.ts --write, one transaction,
#     snapshot monica_preconstruction_20260802_122354.
#  3. VERIFIED. checkAgentMonicaDrift.ts: 0 drift across all three populations
#     (4345 single-body + 983 two-body + 71 full-chart = 5399), every row
#     matching a fresh computation to 1e-5.
#
# One correction the disarm note earned: it predicted "all 469 two-body and 71
# full-chart rows" would be rewritten. The two-body population was **983**, not
# 469 — it had more than doubled while every doc kept quoting the old figure.
# The hazard it described was real and slightly understated.
#
# The reasoning above stands unchanged and is why this stays a schedule +
# workflow_dispatch job: --max-new still bounds only NEW arrivals, so a future
# engine change reopens exactly the same window. DISARM AGAIN before the next
# one.
#
# ── ⚠️ 2026-08-03 — THE WINDOW REOPENED, EXACTLY AS PREDICTED ───────────────
#
# The sentence directly above is not hypothetical. It came true in eight days.
#
# PRs #721/#722 replaced Layer 2 with the degree-level 5-fold dignity manifest
# in BOTH runtimes — a weight-derived-monica change of precisely the kind the
# note warned about — and this workflow was NOT disarmed beforehand. It was
# caught at 22:30 UTC with the 06:45 run ~8h away, while tracing write paths
# for the follow-up backfill. Had it fired, all 5485 already-classified rows
# would have been rewritten unattended, unbounded (--max-new gates only
# `monica_method IS NULL`, and there were ZERO new arrivals that night, so it
# would have bounded nothing at all).
#
# Disarmed via `gh workflow disable "Monica Backfill"` rather than a PR —
# the CLI takes effect immediately, where a workflow-file change would not have
# landed before 06:45. Use the CLI for the stop, a PR for the record.
#
# ── All three re-arm conditions met, 2026-08-03 ─────────────────────────────
#
#  1. DEPLOYED. Verified from each deployment's OWN commit SHA, never local git:
#     Vercel production READY at 37240a492 (= origin/master HEAD); Railway
#     service WhatToEatNext SUCCESS at b96a1e649 (#721). Railway showed #722 and
#     #723 as SKIPPED — confirmed correct, not a failed deploy: both touched
#     zero backend/ files, while #721 touched five.
#  2. BACKFILL RAN. backfillMonicaPerConstruction.ts --write, one transaction,
#     snapshot monica_preconstruction_20260803_225237. A SECOND, independent
#     snapshot was taken first (snapshotAgentMonica.ts →
#     agent_monica_snapshot_20260803_224249) so a crash during the migration's
#     own initialisation could not leave us without a restore point.
#  3. VERIFIED. checkAgentMonicaDrift.ts: 0 drift across all three populations
#     (4358 single-body + 1056 two-body + 71 full-chart = 5485), accounting
#     closed at 5541/5541 agents, every row matching a fresh computation to
#     1e-5. §18o invariant re-checked post-write: monica_constant populated for
#     single-body only, 0 for two-body and full-chart.
#
# POPULATION, RE-MEASURED. The two-body family is **1056** as of 2026-08-03.
# It was 469 (2026-07-21), then 983 (2026-08-02), now 1056 — it has grown at
# every single measurement, and every time some doc was still quoting the
# previous figure. Do not quote this number either; run the dry run.
#
# One thing this cycle adds to the runbook: `alchemical_constitutions` was
# deliberately NOT backfilled alongside. A control test (recompute with the OLD
# dignity, compare to stored) FAILED on both recomputable rows, proving the
# stored-vs-fresh gap was not attributable to the dignity change — it predates
# it. Two of its four rows have no birth data at all. Backfilling it would have
# applied unrelated physics drift, on degraded geometry (natal_chart.planets[]
# carries no geocentric distance), under a "dignity backfill" label. Always
# control a backfill against the OLD engine before attributing a delta to the
# new one.
# ────────────────────────────────────────────────────────────────────────────

name: Monica Backfill

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Bound on first-time classifications (raise only after reading a dry run)"
        required: false
        default: "500"

concurrency:
  # Never two writers at once. `cancel-in-progress: false` deliberately — a write
  # in flight is not something to cancel; the transaction should finish.
  group: monica-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Classify new agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require the database secret
        # FAIL, do not skip. A skipped write job renders green, and "the backfill
        # is running" would then be an assumption rather than a fact — with the
        # queue quietly growing until the integrity threshold trips days later.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "::error::DATABASE_PUBLIC_URL secret is not set — the nightly backfill is NOT operational."
            exit 1
          fi
          echo "database secret present"

      - name: Dry run (what would change)
        # Runs first and is kept in the log even when the write succeeds. If a
        # write is ever wrong, the plan that produced it is the first thing anyone
        # needs, and reconstructing it after the fact is not possible.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/backfillMonicaPerConstruction.ts

      - name: Backfill
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          MAX_NEW: ${{ github.event.inputs.max_new || '500' }}
        run: bun scripts/backfillMonicaPerConstruction.ts --write --max-new="$MAX_NEW"

      - name: Verify the write against a fresh computation
        # The write is only as trustworthy as its verification. This re-derives
        # every stored value from the engine and fails on any disagreement, so a
        # backfill that wrote something wrong cannot report success.
        if: ${{ !cancelled() }}
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkAgentMonicaDrift.ts

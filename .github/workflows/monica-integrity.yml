# Agent-monica integrity gate (§18).
#
# TWO jobs, because the two failure modes need different witnesses and only one
# of them needs a database:
#
#   fabricated-fallback-scan   every push/PR, NO secrets. Static. Catches the
#                              CODE defect: a reader that invents a monica.
#   agent-monica-data          master + daily cron, needs the DB. Catches the
#                              DATA defect: values that drift from the engine.
#
# Neither can substitute for the other. On 2026-07-22 an integrity audit reported
# "ALL CLEAR — 22 checks, 0 failures" while 584 agents were being served a
# fabricated 3.5, because the data was correct and only the readers were wrong.
# Checking data alone cannot detect a reader pointed at the wrong column.

name: Monica Integrity

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # 07:15 UTC daily. The agent population grows continuously (4822 -> 5006 in
    # under three days) and new arrivals land unclassified, so drift appears
    # between deploys, not only at them. A deploy-triggered check alone is blind
    # to that.
    - cron: "15 7 * * *"

concurrency:
  group: monica-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static. Runs everywhere, including forks — no secrets, so nothing to leak.
  # ---------------------------------------------------------------------------
  fabricated-fallback-scan:
    name: No fabricated monica fallbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Scan for invented monica fallbacks
        # Exits non-zero if any reader on the AGENT monica path falls back to a
        # numeric literal, or tests a monica for truthiness (falsy at a real 0,
        # which 284 agents have). Recipe-engine defaults are reported, not fatal.
        run: bun scripts/checkNoFabricatedMonicaFallback.ts

      # The formula gate needs the TypeScript compiler API, so unlike the scan
      # above it cannot run on a bare checkout.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: No stray kalchm formula
        # Exits non-zero on any NEW self-exponentiation (x^x) outside the canonical
        # engine. The allowlist is now at its TARGET END STATE: exactly ONE entry,
        # the characterisation test's own restatement of the definition, which it
        # needs in order to measure anything against it. The list may shrink; it
        # must not grow.
        #
        # This is the CODE-STRUCTURE witness, distinct from the two above: the
        # fallback scan catches a reader that invents a value, the data job catches
        # values that drift, and this catches a second ENGINE being introduced —
        # which produces values that are wrong from birth and drift-clean, so
        # neither of the others can see it.
        run: bun scripts/checkNoStrayKalchmFormula.ts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cross-runtime engine parity (Python half)
        # The kalchm formula exists once PER RUNTIME, and the AST gate above is a
        # TypeScript gate — it structurally cannot see the Python engine, which
        # serves production traffic via backend/Dockerfile's uvicorn CMD.
        #
        # Both halves read the SAME golden vectors
        # (backend/tests/kalchm_golden_vectors.json), so a change to either
        # runtime that is not mirrored in the other fails here.
        #
        # Only pytest is installed, deliberately: the engine module has NO
        # framework imports, and keeping it that way is the property being
        # protected. If this step ever needs fastapi to collect, the engine has
        # been re-entangled with the web app and the gate is one refactor away
        # from being skipped.
        run: |
          python -m pip install --quiet pytest
          python -m pytest backend/tests/test_kalchm_parity.py -q

      - name: Deployed-server planet weighting (Python)
        # backend/alchm_kitchen/main.py is what Railway actually serves, and it
        # carries an INLINE copy of the orbital-period weight table that PR #697
        # deleted from backend/utils/. Until test_main_planet_weighting.py it had
        # NO coverage at all — the inverse risk of the parity gate above: nothing
        # would break when it moved, and nothing would say it had moved.
        #
        # That test reads main.py's SOURCE and extracts the weighting with `ast`
        # rather than importing it, precisely so this step keeps the pytest-only
        # install described above. If it ever needs fastapi, the extraction has
        # been replaced by an import and the same warning applies.
        run: python -m pytest backend/tests/test_main_planet_weighting.py -q

  # ---------------------------------------------------------------------------
  # PRE-MERGE. The two gates a PULL REQUEST DIFF can actually break, run BEFORE
  # the code reaches master.
  #
  # The problem this solves: every DB gate ran only on master + cron, so the
  # earliest anything could fail was after merge, with the deploy already in
  # flight. `[MEASURED 2026-07-29]` five master SHAs whose integrity run concluded
  # `failure` each received a Production deployment of that same SHA, three
  # created strictly after the failure verdict. The gate was not a gate; it was a
  # notification.
  #
  # ── Two deliberate limits, both load-bearing ──────────────────────────────
  #
  # 1. `pull_request`, NOT `pull_request_target`, and same-repo ONLY.
  #    `pull_request_target` runs with the base repo's secrets against the PR's
  #    code — here that means `bun install --frozen-lockfile` on a PR-AUTHORED
  #    lockfile with DATABASE_PUBLIC_URL in the environment, i.e. arbitrary
  #    postinstall code holding production database credentials. The head-repo
  #    condition below is what keeps this safe; do not remove it, and do not
  #    "fix" a skipped fork PR by switching the trigger.
  #
  # 2. ONLY the diff-sensitive gates. The other five assert production DATA
  #    state that no PR diff controls. As required checks they would block every
  #    unrelated PR on someone else's data condition — the drift check was red
  #    across eight consecutive runs over ~20 hours for a self-resolving queue
  #    caused by no PR at all. That is the exact failure #665 was written to stop,
  #    and promoting the whole workflow would reintroduce it.
  # ---------------------------------------------------------------------------
  pre-merge-sql:
    name: SQL a PR can break (pre-merge)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require the database secret
        id: db-secret
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "DATABASE_PUBLIC_URL is not set — these gates cannot run." >&2
            exit 1
          fi
          echo "secret present"

      - name: Economy SQL parses against PostgreSQL
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # Diff-sensitive: it imports the live query builders, so a PR that edits
        # them can make this fail. PREPARE writes nothing.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkEconomySqlParses.ts

      - name: Agents leave the writer already classified
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # Diff-sensitive: it extracts the provisioning statements from the route
        # and service SOURCE and executes them, rolled back. A PR that edits
        # either writer changes what this runs.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkAgentClassifiedAtCreation.mjs

      - name: Environmental SQL parses against PostgreSQL
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # Diff-sensitive: it imports the live query builders AND applies
        # migration 74, so a PR that edits either one changes what this runs.
        # Self-provisioning — it creates the schema inside a transaction and
        # rolls back, so it works before the migration is applied anywhere and
        # verifies that the migration and the queries agree.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkEnvironmentalSqlParses.ts

      - name: Sampling hour agrees between TypeScript and SQL
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # The ingestion cron derives a geohash's sampling hour twice, in two
        # languages — SQL decides when a cell is due, TypeScript decides which
        # hour's reading to keep. They shipped disagreeing for 97% of cells,
        # which silently stopped roughly half the fleet ever writing a row.
        # Neither a typechecker nor a mocked-DB test can see this: the two
        # expressions never meet in the same process. Read-only; one SELECT over
        # a literal array, no table touched.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkSamplingHourAgrees.ts

  # ---------------------------------------------------------------------------
  # Data. master + cron only: it needs production credentials, so it must never
  # run on a pull_request from a fork.
  # ---------------------------------------------------------------------------
  agent-monica-data:
    name: Agent monica drift + integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────────
      # Every DB gate below carries
      #     if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
      #
      # WHY: by default a failed step cancels the rest of the job, so ONE red gate
      # silently skips every gate after it. `[MEASURED 2026-07-28]` that is not
      # hypothetical — the drift check had been failing on master since
      # 2026-07-26 on 108 rows that were merely UNCLASSIFIED (`drifted 0`,
      # `wrong-method 0`: new agents arrive without a monica and a backfill assigns
      # one). Four further gates were skipped behind it, including two that had
      # NEVER run since being added: the economy SQL PREPARE gate and the
      # ledger/balance reconciliation gate.
      #
      # A routine, self-resolving data condition was therefore masking the checks
      # that guard money and SQL validity — the "a gate that cannot run reads as a
      # pass" failure this workflow exists to prevent, arriving through a side
      # door. Each gate now reports independently and the job is red if ANY of them
      # is, which is the signal we actually want.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop, not keep
      # opening connections to production. Gated on `db-secret` because without the
      # secret every gate fails identically for one uninteresting reason, and five
      # copies of the same error hide which gate is genuinely broken.
      # ─────────────────────────────────────────────────────────────────────
      - name: Require the database secret
        id: db-secret
        # FAIL, do not skip. A skipped job renders as a green check, and a green
        # check that verified nothing is the exact failure this gate exists to
        # prevent. If this step fails, the gate is not operational — add the
        # DATABASE_PUBLIC_URL repository secret.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "::error::DATABASE_PUBLIC_URL secret is not set — this gate is NOT operational."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "database secret present"

      - name: Drift check (recomputes every value from the engine)
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkAgentMonicaDrift.ts

      - name: Integrity audit (asserts structure directly in SQL)
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # The SECOND, INDEPENDENT witness. It matters that there are two: the
        # drift check re-derives values from the engine, while this asserts
        # structure directly in SQL and reuses none of the backfill's
        # classification logic.
        #
        # A mis-classifying script PASSES ITS OWN RE-RUN. That nearly shipped
        # twice on 2026-07-22, which is why neither tool is allowed to be the
        # only witness. It also identifies the true rollback snapshot BY CONTENT
        # — there are three `monica_preconstruction_*` tables and only the first
        # restores anything, so picking the newest by name is wrong.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/auditAgentDataIntegrity.ts

      - name: No new cloned natal charts
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # A THIRD data witness, watching a defect the other two cannot see: a
        # chart REUSED as a fallback across several agents. Drift-clean by
        # construction (the value is correctly derived from the chart it has) and
        # structurally valid in SQL, so both existing witnesses pass on it.
        #
        # It is a GROWTH detector, not a unique index — two people can legitimately
        # share a birth moment. It fails when the cloned-row count rises above the
        # recorded baseline of 10, and also when it FALLS without KNOWN_GROUPS being
        # updated, because a resolved clone changes the |max| population that the
        # Sacred-7 full-chart scale is derived from.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkNoNewClonedCharts.ts

      - name: No fabricated fields on stored natal bodies
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # A FOURTH data witness. The other three all passed while every one of the
        # 710 stored bodies carried `longitude: 0` — a fabricated literal, since
        # the upstream producer evaluates `data?.longitude ?? data?.degrees ?? 0`
        # over objects that have neither key. Drift-clean (the canonical parser
        # ignores it), structurally valid, and not a clone, so nothing else saw it.
        #
        # `0` is not nullish, so a `?? longitude ??` chain STOPS there and never
        # reaches `degree` — which is how an earlier audit "found" 71 all-zero
        # charts that were nothing of the kind.
        #
        # The ingest endpoints now strip the key, but the upstream provisioning
        # scripts are run BY HAND against this database. This step is what notices
        # if that stripping is ever removed or routed around by a new write path.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkNoFabricatedNatalFields.ts

      - name: Economy SQL parses against PostgreSQL
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # SQL is a second language here and ONLY the database can typecheck it.
        # The credit statement once shipped in a state PostgreSQL refused to
        # prepare at all (42P08, a bind parameter deduced as two different
        # types) — so every credit threw. Thirteen unit tests covered that path
        # and all thirteen passed, because they mock the database, and a mock
        # accepts SQL no database would.
        #
        # PREPARE does parse + parameter-type analysis and writes NOTHING: no
        # transaction, no rows. It also catches a misspelled column and a
        # parameter count that has drifted from the call site.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkEconomySqlParses.ts

      - name: Balances reconcile with their own ledger
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # A FIFTH data witness, for a defect that lives in the RELATIONSHIP between
        # two tables rather than inside either one. Every witness above passed while
        # 521.7141 Spirit across 67 users sat in the ledger and never reached a
        # balance: the ledger was correct, the balances were internally valid, no
        # constraint was violated, no value drifted from an engine, no row was
        # cloned, no field was fabricated. Nothing compared the two.
        #
        # The cause was `WITH ensure_balance AS (INSERT …) UPDATE token_balances …`:
        # a data-modifying CTE gives every sub-statement ONE pre-statement snapshot,
        # so the UPDATE could not see the row the CTE had just inserted. It failed
        # silently because an empty RETURNING is indistinguishable from an
        # idempotency replay at the call site.
        #
        # The comparison is PER USER and PER AXIS deliberately: offsetting per-user
        # differences net to zero in a table-wide SUM, and only Spirit ever drifted
        # (the four axes are separate statements in one transaction, so only the
        # first met the missing-row state).
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkLedgerBalanceReconciliation.ts

      - name: Agents leave the writer already classified
        if: ${{ !cancelled() && steps.db-secret.outcome == 'success' }}
        # A SIXTH data witness, and the only one that tests a WRITER rather than
        # stored state. It executes the real provisioning statements — extracted
        # from the route/service source, never hand-copied — against real
        # PostgreSQL inside a transaction that is always rolled back.
        #
        # It is added to CI here because it was not wired in when it was written.
        # #666 shipped it, and it has never run: not in this workflow, not in
        # package.json, not anywhere. So the regression it exists to catch went
        # on happening in production for a further day, unobserved.
        #
        # That is the second half of the same lesson. #666 also pointed the gate
        # at `sync-debit` and `internal/agent-sync`, neither of which creates
        # agents — `[MEASURED 2026-07-29]` 370 of 370 arrivals over seven days
        # carry `userDatabaseService.ensureAgent`'s fingerprint and 0 carry
        # sync-debit's. A gate can execute real SQL against a real database,
        # report honestly, pass, and still prove nothing, if it is aimed at a
        # statement nobody runs. Section 3b now covers the real producer.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkAgentClassifiedAtCreation.mjs

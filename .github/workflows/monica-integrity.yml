# Agent-monica integrity gate (§18).
#
# TWO jobs, because the two failure modes need different witnesses and only one
# of them needs a database:
#
#   fabricated-fallback-scan   every push/PR, NO secrets. Static. Catches the
#                              CODE defect: a reader that invents a monica.
#   agent-monica-data          master + daily cron, needs the DB. Catches the
#                              DATA defect: values that drift from the engine.
#
# Neither can substitute for the other. On 2026-07-22 an integrity audit reported
# "ALL CLEAR — 22 checks, 0 failures" while 584 agents were being served a
# fabricated 3.5, because the data was correct and only the readers were wrong.
# Checking data alone cannot detect a reader pointed at the wrong column.

name: Monica Integrity

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # 07:15 UTC daily. The agent population grows continuously (4822 -> 5006 in
    # under three days) and new arrivals land unclassified, so drift appears
    # between deploys, not only at them. A deploy-triggered check alone is blind
    # to that.
    - cron: "15 7 * * *"

concurrency:
  group: monica-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static. Runs everywhere, including forks — no secrets, so nothing to leak.
  # ---------------------------------------------------------------------------
  fabricated-fallback-scan:
    name: No fabricated monica fallbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Scan for invented monica fallbacks
        # Exits non-zero if any reader on the AGENT monica path falls back to a
        # numeric literal, or tests a monica for truthiness (falsy at a real 0,
        # which 284 agents have). Recipe-engine defaults are reported, not fatal.
        run: bun scripts/checkNoFabricatedMonicaFallback.ts

      # The formula gate needs the TypeScript compiler API, so unlike the scan
      # above it cannot run on a bare checkout.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: No stray kalchm formula
        # Exits non-zero on any NEW self-exponentiation (x^x) outside the canonical
        # engine. The allowlist is now at its TARGET END STATE: exactly ONE entry,
        # the characterisation test's own restatement of the definition, which it
        # needs in order to measure anything against it. The list may shrink; it
        # must not grow.
        #
        # This is the CODE-STRUCTURE witness, distinct from the two above: the
        # fallback scan catches a reader that invents a value, the data job catches
        # values that drift, and this catches a second ENGINE being introduced —
        # which produces values that are wrong from birth and drift-clean, so
        # neither of the others can see it.
        run: bun scripts/checkNoStrayKalchmFormula.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cross-runtime engine parity (Python half)
        # The kalchm formula exists once PER RUNTIME, and the AST gate above is a
        # TypeScript gate — it structurally cannot see the Python engine, which
        # serves production traffic via backend/Dockerfile's uvicorn CMD.
        #
        # Both halves read the SAME golden vectors
        # (backend/tests/kalchm_golden_vectors.json), so a change to either
        # runtime that is not mirrored in the other fails here.
        #
        # Only pytest is installed, deliberately: the engine module has NO
        # framework imports, and keeping it that way is the property being
        # protected. If this step ever needs fastapi to collect, the engine has
        # been re-entangled with the web app and the gate is one refactor away
        # from being skipped.
        run: |
          python -m pip install --quiet pytest
          python -m pytest backend/tests/test_kalchm_parity.py -q

  # ---------------------------------------------------------------------------
  # Data. master + cron only: it needs production credentials, so it must never
  # run on a pull_request from a fork.
  # ---------------------------------------------------------------------------
  agent-monica-data:
    name: Agent monica drift + integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require the database secret
        # FAIL, do not skip. A skipped job renders as a green check, and a green
        # check that verified nothing is the exact failure this gate exists to
        # prevent. If this step fails, the gate is not operational — add the
        # DATABASE_PUBLIC_URL repository secret.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "::error::DATABASE_PUBLIC_URL secret is not set — this gate is NOT operational."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "database secret present"

      - name: Drift check (recomputes every value from the engine)
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkAgentMonicaDrift.ts

      - name: Integrity audit (asserts structure directly in SQL)
        # The SECOND, INDEPENDENT witness. It matters that there are two: the
        # drift check re-derives values from the engine, while this asserts
        # structure directly in SQL and reuses none of the backfill's
        # classification logic.
        #
        # A mis-classifying script PASSES ITS OWN RE-RUN. That nearly shipped
        # twice on 2026-07-22, which is why neither tool is allowed to be the
        # only witness. It also identifies the true rollback snapshot BY CONTENT
        # — there are three `monica_preconstruction_*` tables and only the first
        # restores anything, so picking the newest by name is wrong.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/auditAgentDataIntegrity.ts

      - name: No new cloned natal charts
        # A THIRD data witness, watching a defect the other two cannot see: a
        # chart REUSED as a fallback across several agents. Drift-clean by
        # construction (the value is correctly derived from the chart it has) and
        # structurally valid in SQL, so both existing witnesses pass on it.
        #
        # It is a GROWTH detector, not a unique index — two people can legitimately
        # share a birth moment. It fails when the cloned-row count rises above the
        # recorded baseline of 10, and also when it FALLS without KNOWN_GROUPS being
        # updated, because a resolved clone changes the |max| population that the
        # Sacred-7 full-chart scale is derived from.
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: bun scripts/checkNoNewClonedCharts.ts
